<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bible in a Year - Create your personalized Bible reading plan">
    <title>Bible in a Year</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <!-- Video Background -->
    <video class="video-background" autoplay muted loop playsinline>
        <source src="https://cdn.pixabay.com/video/2023/04/19/159627-819346937_large.mp4" type="video/mp4">
        <!-- Fallback to another nature video if the first doesn't load -->
        <source src="https://cdn.pixabay.com/video/2020/05/11/38095-419186286_large.mp4" type="video/mp4">
    </video>
    
    <!-- Overlay for better text readability -->
    <div class="video-overlay"></div>
    
    <!-- Main Content -->
    <main class="landing-container" id="setup-section">
        <h1 class="main-title">Bible in a Year</h1>
        
        <div class="input-container">
            <input 
                type="date" 
                id="start_date" 
                class="date-picker"
                aria-label="Select starting date"
            >
            <button id="generate-btn" class="submit-btn">
                Start Journey
            </button>
        </div>
    </main>

    <!-- Reading Plan Section (Hidden by default) -->
    <section class="plan-section" id="plan-section" style="display: none;">
        <div class="plan-container">
            <div class="plan-header">
                <h2 class="plan-title">Your Reading Plan</h2>
                <button id="reset-btn" class="back-btn">← Back</button>
            </div>
            <div class="controls">
                <button id="print-btn" class="control-btn">Print Plan</button>
                <button id="clear-progress-btn" class="control-btn">Clear Progress</button>
            </div>
            <div id="output" class="reading-plan-output"></div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="printDates.js"></script>
</body>
</html>
